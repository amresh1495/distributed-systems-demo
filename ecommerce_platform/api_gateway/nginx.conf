# nginx.conf for API Gateway

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define upstreams for all backend services
    # The names (e.g., user_service_upstream) are arbitrary but must be unique.
    # The server address (e.g., user_service:8000) must match the service name
    # and port defined in docker-compose.yml.

    upstream user_service_upstream {
        server user_service:8000;
    }
    upstream product_service_upstream {
        server product_service:8000;
    }
    upstream inventory_service_upstream {
        server inventory_service:8000;
    }
    upstream order_service_upstream {
        server order_service:8000;
    }
    upstream payment_service_upstream {
        server payment_service:8000;
    }
    upstream notification_service_upstream {
        server notification_service:8000;
    }

    server {
        listen 80;
        server_name localhost; # Or your domain

        # It's good practice to add a default resolver.
        # For Docker, this is often Docker's internal DNS resolver.
        resolver 127.0.0.11 valid=30s; # Docker's embedded DNS server

        # Basic health check for the gateway itself
        location /gateway_status {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }

        # --- User Service Routes ---
        # Frontend calls /api/users/... which maps to user_service_upstream/api/v1/users/...
        location /api/users {
            rewrite ^/api/users(/.*)$ /api/v1/users$1 break;
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Product Service Routes ---
        # Frontend calls /api/products/... which maps to product_service_upstream/api/v1/products/...
        location /api/products {
            rewrite ^/api/products(/.*)$ /api/v1/products$1 break;
            proxy_pass http://product_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Inventory Service Routes ---
        # Frontend/Service calls /api/inventory/... maps to inventory_service_upstream/api/v1/inventory/...
        location /api/inventory {
            rewrite ^/api/inventory(/.*)$ /api/v1/inventory$1 break;
            proxy_pass http://inventory_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Order Service Routes ---
        # Frontend calls /api/orders/... maps to order_service_upstream/api/v1/orders/...
        location /api/orders {
            rewrite ^/api/orders(/.*)$ /api/v1/orders$1 break;
            proxy_pass http://order_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Payment Service Routes ---
        # Service calls /api/payments/... maps to payment_service_upstream/api/v1/payments/...
        location /api/payments {
            rewrite ^/api/payments(/.*)$ /api/v1/payments$1 break;
            proxy_pass http://payment_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Notification Service Routes ---
        # Service calls /api/notifications/... maps to notification_service_upstream/api/v1/notifications/...
        location /api/notifications {
             rewrite ^/api/notifications(/.*)$ /api/v1/notifications$1 break;
             proxy_pass http://notification_service_upstream;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Frontend Static Files ---
        # This assumes your frontend/index.html and other assets are served by a service
        # or you might serve them directly from Nginx if they are static.
        # For this project, the frontend is minimal and primarily for demonstration.
        # If you build your frontend and put it in a 'static' directory inside 'api_gateway':
        # location / {
        #    root /usr/share/nginx/html; # Assuming you copy frontend files here in api_gateway Dockerfile
        #    try_files $uri $uri/ /index.html;
        # }
        # For now, the JS app.js makes calls to /api, so the above API locations are key.
        # If the frontend files (index.html, app.js, style.css) are to be served by the gateway:
        # 1. Copy them into the api_gateway Docker image (e.g., to /usr/share/nginx/html/frontend)
        # 2. Add a location block:
        # location / {
        #    alias /usr/share/nginx/html/frontend/; # Note the trailing slash
        #    try_files $uri $uri/ /index.html;
        # }
        # For simplicity, we'll assume the frontend directory is directly accessible for now,
        # and later adjust if building it into the gateway.
        # The current frontend/app.js uses relative paths like `/api`, so the gateway must handle these.

        # Error pages (optional but good practice)
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html; # Default Nginx error page location
        }
    }
}
