apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx-conf
  namespace: ecommerce-ns
  labels:
    app: api-gateway
data:
  nginx.conf: |
    # This Nginx configuration will be loaded by the API Gateway pods.
    # It should be the same content as ecommerce_platform/api_gateway/nginx.conf
    # but adapted for Kubernetes service discovery.
    # Upstream service names will be their K8s service DNS names.
    # e.g., user-service-svc.ecommerce-ns.svc.cluster.local or simply user-service-svc

    worker_processes 1;

    events {
        worker_connections 1024;
    }

    http {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Kubernetes service DNS names. Format: <service-name>.<namespace>.svc.cluster.local
        # Or, within the same namespace, just <service-name> often works.
        # Using <service-name>-svc as per our service naming convention.
        # Nginx needs to resolve these. Adding a resolver is good practice.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s; # K8s internal DNS

        upstream user_service_upstream {
            server user-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }
        upstream product_service_upstream {
            server product-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }
        upstream inventory_service_upstream {
            server inventory-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }
        upstream order_service_upstream {
            server order-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }
        upstream payment_service_upstream {
            server payment-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }
        upstream notification_service_upstream {
            server notification-service-svc.ecommerce-ns.svc.cluster.local:8000;
        }

        server {
            listen 80;
            server_name localhost; # Adjust if needed

            location /gateway_status {
                return 200 'API Gateway (K8s) is running';
                add_header Content-Type text/plain;
            }

            # --- User Service Routes ---
            location /api/users {
                rewrite ^/api/users(/.*)$ /api/v1/users$1 break;
                proxy_pass http://user_service_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # --- Product Service Routes ---
            location /api/products {
                rewrite ^/api/products(/.*)$ /api/v1/products$1 break;
                proxy_pass http://product_service_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # --- Inventory Service Routes ---
            location /api/inventory {
                rewrite ^/api/inventory(/.*)$ /api/v1/inventory$1 break;
                proxy_pass http://inventory_service_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # --- Order Service Routes ---
            location /api/orders {
                rewrite ^/api/orders(/.*)$ /api/v1/orders$1 break;
                proxy_pass http://order_service_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # --- Payment Service Routes ---
            location /api/payments {
                rewrite ^/api/payments(/.*)$ /api/v1/payments$1 break;
                proxy_pass http://payment_service_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # --- Notification Service Routes ---
            location /api/notifications {
                 rewrite ^/api/notifications(/.*)$ /api/v1/notifications$1 break;
                 proxy_pass http://notification_service_upstream;
                 proxy_set_header Host $host;
                 proxy_set_header X-Real-IP $remote_addr;
                 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                 proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Serve frontend static files (index.html, style.css, app.js)
            # This assumes these files are baked into the api-gateway image at /var/www/frontend
            # The api_gateway/Dockerfile would need to be updated to copy these.
            # Example: COPY ../frontend /var/www/frontend
            location / {
                root /var/www/frontend; # Adjust this path if needed
                try_files $uri $uri/ /index.html;
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: ecommerce-ns
  labels:
    app: api-gateway
spec:
  replicas: 2 # Can be scaled based on traffic
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: your-repo/api-gateway:latest # Custom image with Nginx and frontend files
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf # Mount the nginx.conf key from the ConfigMap
            # If frontend files are not baked into the image, they could also be mounted
            # from a ConfigMap or a persistent volume, though baking them in is common for Nginx.
          readinessProbe:
            httpGet:
              path: /gateway_status # Health check defined in nginx.conf
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /gateway_status
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: nginx-config-volume
          configMap:
            name: api-gateway-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: ecommerce-ns
  labels:
    app: api-gateway
spec:
  type: LoadBalancer # Exposes the service externally using a cloud provider's load balancer
  # For Minikube, you might need to run `minikube service api-gateway-svc -n ecommerce-ns`
  # or use `minikube tunnel`. NodePort is another option for local clusters.
  # type: NodePort
  ports:
    - port: 80 # Port the LB listens on
      targetPort: 80 # Port on the Nginx container
      protocol: TCP
      name: http
      # nodePort: 30080 # If type: NodePort, specify a port (optional, K8s assigns if not)
  selector:
    app: api-gateway
---
# Note for API Gateway Dockerfile:
# The Dockerfile for `api_gateway` (`ecommerce_platform/api_gateway/Dockerfile`)
# currently just copies `nginx.conf`. For K8s, this `nginx.conf` is supplied by a ConfigMap.
# The K8s version of `nginx.conf` also includes a `location /` block to serve frontend files.
# This implies the `api_gateway` Docker image should contain these frontend files.
# So, the `ecommerce_platform/api_gateway/Dockerfile` should be updated to copy the `frontend` directory,
# e.g., `COPY ../frontend /var/www/frontend` (adjust path as needed).
# If this is not done, the `location /` block in K8s Nginx config will not find the files.
#
# Current api_gateway/Dockerfile:
# FROM nginx:latest
# RUN rm /etc/nginx/conf.d/default.conf
# COPY nginx.conf /etc/nginx/nginx.conf <--- This is for Docker Compose
# EXPOSE 80
# CMD ["nginx", "-g", "daemon off;"]
#
# For K8s, the nginx.conf is mounted from ConfigMap. The CMD is fine.
# The image used (`your-repo/api-gateway:latest`) should be built with frontend files included.
# Example modification to `ecommerce_platform/api_gateway/Dockerfile` for K8s image:
#
# FROM nginx:latest
# # No need to copy nginx.conf here if it's always supplied by ConfigMap in K8s
# # However, for local `docker build` and testing, or for Docker Compose, it's still useful.
# # The K8s deployment will overwrite /etc/nginx/nginx.conf with the ConfigMap version.
# COPY nginx.conf /etc/nginx/nginx-default.conf # Keep a default for non-K8s or reference
#
# # Add frontend files
# WORKDIR /var/www
# COPY ../frontend ./frontend # Copies entire frontend dir to /var/www/frontend
# WORKDIR /
#
# EXPOSE 80
# CMD ["nginx", "-g", "daemon off;"]
#
# This way, the image `your-repo/api-gateway:latest` would contain the frontend files at `/var/www/frontend`,
# matching the `root /var/www/frontend;` directive in the K8s Nginx ConfigMap.
# I'll make a note to update this Dockerfile later or assume it's built this way.
# For now, the K8s manifest is structured correctly based on that assumption.
