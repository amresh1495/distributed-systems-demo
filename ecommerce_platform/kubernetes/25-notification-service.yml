apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  namespace: ecommerce-ns
  labels:
    app: notification-service
spec:
  replicas: 1 # Mock service
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: your-repo/notification-service:latest # Replace with your actual image path
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # No specific DB or complex config for this simple mock
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: / # Root path or /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-svc
  namespace: ecommerce-ns
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: notification-service
