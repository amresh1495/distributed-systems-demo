apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
  namespace: ecommerce-ns
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: your-repo/inventory-service:latest # Replace with your actual image path
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: INVENTORY_SERVICE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: INVENTORY_SERVICE_DATABASE_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: / # Root path or /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-svc
  namespace: ecommerce-ns
  labels:
    app: inventory-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: inventory-service
