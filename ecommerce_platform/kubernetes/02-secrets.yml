apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-ns
type: Opaque
data:
  # Base64 encoded secrets. Use `echo -n "your-value" | base64`
  # For PostgreSQL
  POSTGRES_USER: ZWNvbW1lcmNlX3VzZXI= # ecommerce_user
  POSTGRES_PASSWORD: ZWNvbW1lcmNlX3Bhc3N3b3Jk # ecommerce_password

  # For User Service JWT
  # Generate strong, unique secrets for production
  JWT_SECRET_KEY: eW91cl9zdXBlcl9zZWNyZXRfa2V5X2Zvcl9qd3RfaW5fa KThz # your_super_secret_key_for_jwt_in_k8s
  JWT_ALGORITHM: SFMyNTY= # HS256

  # Database URLs - These construct the full URL using other secret values
  # It's often better to construct these within the pod using an init container or entrypoint script
  # if your app can't template them directly from discrete env vars.
  # However, for simplicity, showing pre-constructed (but still from secrets)
  # Note: The service name 'postgres-svc' will be defined for the PostgreSQL statefulset/service
  USER_SERVICE_DATABASE_URL: cG9zdGdyZXNxbDovL2Vjb21tZXJjZV91c2VyOmVjb21tZXJjZV9wYXNzd29yZEBwb3N0Z3Jlcy1zdmM6NTQzMi91c2VyX3NlcnZpY2VfZGI=
  # -> postgresql://ecommerce_user:ecommerce_password@postgres-svc:5432/user_service_db
  PRODUCT_SERVICE_DATABASE_URL: cG9zdGdyZXNxbDovL2Vjb21tZXJjZV91c2VyOmVjb21tZXJjZV9wYXNzd29yZEBwb3N0Z3Jlcy1zdmM6NTQzMi9wcm9kdWN0X3NlcnZpY2VfZGI=
  # -> postgresql://ecommerce_user:ecommerce_password@postgres-svc:5432/product_service_db
  INVENTORY_SERVICE_DATABASE_URL: cG9zdGdyZXNxbDovL2Vjb21tZXJjZV91c2VyOmVjb21tZXJjZV9wYXNzd29yZEBwb3N0Z3Jlcy1zdmM6NTQzMi9pbnZlbnRvcnlfc2VydmljZV9kYg==
  # -> postgresql://ecommerce_user:ecommerce_password@postgres-svc:5432/inventory_service_db
  ORDER_SERVICE_DATABASE_URL: cG9zdGdyZXNxbDovL2Vjb21tZXJjZV91c2VyOmVjb21tZXJjZV9wYXNzd29yZEBwb3N0Z3Jlcy1zdmM6NTQzMi9vcmRlcl9zZXJ2aWNlX2Ri
  # -> postgresql://ecommerce_user:ecommerce_password@postgres-svc:5432/order_service_db

# ---
# Note on Database URLs in Secrets:
# While you can store the full URL, it's often more secure and flexible to store components
# (user, password, host, dbname) and let the application or an entrypoint script construct the full URL.
# This avoids repeating the password in multiple secret entries if only the dbname changes.
# For this example, I'm showing full URLs for simplicity of direct use in env vars.
#
# To generate base64 values:
# echo -n "your_secret_value" | base64
# echo -n "ecommerce_user" | base64 -> ZWNvbW1lcmNlX3VzZXI=
# echo -n "ecommerce_password" | base64 -> ZWNvbW1lcmNlX3Bhc3N3b3Jk
# echo -n "your_super_secret_key_for_jwt_in_k8s" | base64 -> eW91cl9zdXBlcl9zZWNyZXRfa2V5X2Zvcl9qd3RfaW5fa KThz
# echo -n "HS256" | base64 -> SFMyNTY=
# echo -n "postgresql://ecommerce_user:ecommerce_password@postgres-svc:5432/user_service_db" | base64 -> cG9zdGdyZXNxbDovL2Vjb21tZXJjZV91c2VyOmVjb21tZXJjZV9wYXNzd29yZEBwb3N0Z3Jlcy1zdmM6NTQzMi91c2VyX3NlcnZpY2VfZGI=
# ...and so on for other DB URLs.
#
# For a real deployment, these secrets should be managed by a secrets management system like HashiCorp Vault or cloud provider KMS.
# Storing them directly in Git (even base64 encoded) is not recommended for production secrets.
# These are for demonstration purposes.
#
# Consider using a tool like `kubeseal` for sealed secrets if you need to store encrypted secrets in Git.
#
# Alternative approach for DB credentials:
# Create separate secrets for POSTGRES_USER and POSTGRES_PASSWORD,
# then in each deployment, define DB_URL templates or use an init script.
# Example:
# env:
#   - name: DB_USER
#     valueFrom:
#       secretKeyRef:
#         name: ecommerce-secrets
#         key: POSTGRES_USER
#   - name: DB_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: ecommerce-secrets
#         key: POSTGRES_PASSWORD
#   - name: DB_HOST
#     value: "postgres-svc" # K8s service name for Postgres
#   - name: USER_SERVICE_DB_NAME
#     value: "user_service_db"
# Then the application or an entrypoint script constructs:
# DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${USER_SERVICE_DB_NAME}"
# This is generally a better practice. I've used the simpler full URL for now.
# The Python services will need to be able to read these env vars.
